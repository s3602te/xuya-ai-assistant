name: Xuya AI CI/CD Pipeline

# 觸發條件 (Triggers)：定義什麼時候要啟動這個自動化流程
on:
  push:
    branches:
      - main # 只要有任何程式碼被 push 到 main 分支，就會觸發

jobs:
  build-and-test:
    runs-on: ubuntu-latest # 使用 GitHub 免費提供的 Ubuntu 伺服器

    steps:
      # 1. 取得最新程式碼把 GitHub 倉庫裡的最新程式碼下載到這台 Ubuntu 伺服器上
      - name: 📥 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      # 2. 準備 Node.js 環境 (用來編譯 React 前端)
      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 指定 Node.js 版本

      # 3. 進入前端資料夾，安裝套件並編譯
      - name: 📦 安裝前端套件與編譯 (npm build)
        working-directory: ./my-aics
        run: |
          npm install
          npm run build

      # 4. CI 核心：將編譯好的前端丟給後端 (自動化搬運)
      - name: 🚚 整合前端靜態檔至後端目錄
        run: |
          # 刪除後端舊的 dist (如果存在)
          rm -rf ./my-aics-backend/dist
          # 將前端剛編譯好的 dist 搬移到後端目錄
          mv ./my-aics/dist ./my-aics-backend/dist
          echo "✅ 前端靜態網頁已成功整合至 Flask 後端目錄！"

      # 5. 防呆測試：讓 Docker 試著包裝一次，確保程式碼沒壞
      - name: 🐳 測試後端 Docker 映像檔建置 (CI 測試)
        working-directory: ./my-aics-backend
        run: |
          docker build -t xuya-ai-backend-test .
          echo "✅ Docker 建置測試通過，程式碼健康度 100%！"